name: Feature request
description: Suggest a new problem, component, trade-off card, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the feature and the interview-prep gap it fills.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - New design problem
        - New infrastructure component
        - New trade-off card / concept-library content
        - Simulation or scoring improvement
        - UX / accessibility
        - Other
  - type: textarea
    id: details
    attributes:
      label: Details / references
      description: Specs, QPS/latency figures, or real-world examples — content here teaches people preparing for real interviews, so sources matter.
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
